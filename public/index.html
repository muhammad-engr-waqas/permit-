<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إنشاء تصريح جديد | New Permit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>إصدار تصريح موارد بشرية</h1>
    <p class="sub">Fill in the details below to generate the permit PDF with QR code.</p>

    <form id="permitForm">
      <fieldset>
        <legend>بيانات العامل / Laborer Information</legend>

        <label>اسم العامل (English)
          <input type="text" name="laborerNameEn" required placeholder="e.g. HAMID KHAN" />
        </label>
        <label>اسم العامل (Arabic)
          <input type="text" name="laborerNameAr" placeholder="e.g. حامد خان" />
        </label>
        <label>المهنة (English)
          <input type="text" name="occupationEn" required placeholder="e.g. Construction Worker" />
        </label>
        <label>المهنة (Arabic)
          <input type="text" name="occupationAr" placeholder="e.g. عامل بناء" />
        </label>
        <label>الجنسية (English)
          <input type="text" name="nationalityEn" required placeholder="e.g. Pakistani" />
        </label>
        <label>الجنسية (Arabic)
          <input type="text" name="nationalityAr" placeholder="e.g. باكستاني" />
        </label>
        <label>رقم الهوية / الإقامة (ID / Iqama Number)
          <input type="text" name="idNumber" required placeholder="e.g. 2558239725" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات مقدم الخدمة / Provider Establishment</legend>
        <label>اسم المنشأة (English)
          <input type="text" name="providerNameEn" required placeholder="e.g. Mubarak Al-Otaibi Est." />
        </label>
        <label>المنشأة المقدمة للخدمة (Arabic)
          <input type="text" name="providerNameAr" placeholder="e.g. مؤسسة مبارك العضيبي" />
        </label>
        <label>رقم المنشأة في وزارة الموارد البشرية (Establishment Number)
          <input type="text" name="providerEstablishmentNumber" required placeholder="e.g. 6-3472812" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات المستفيد من الخدمة / Beneficiary Establishment</legend>
        <label>اسم المنشأة (English)
          <input type="text" name="beneficiaryNameEn" required placeholder="e.g. Arabian Talent Group Co." />
        </label>
        <label>المنشأة المستفيدة من الخدمة (Arabic)
          <input type="text" name="beneficiaryNameAr" placeholder="e.g. شركة مجموعة المواهب العربية الخاصة المحدودة" />
        </label>
        <label>رقم المنشأة في وزارة الموارد البشرية (Establishment Number)
          <input type="text" name="beneficiaryEstablishmentNumber" required placeholder="e.g. 9-4031274" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات التصريح / Permit Information</legend>
        <label>رقم التصريح (Permit Code e.g. TW6617332)
          <input type="text" name="permitCode" placeholder="e.g. TW6617332" />
        </label>
        <label>تاريخ بداية التصريح (Permit Start Date)
          <input type="date" name="permitStartDate" required />
        </label>
        <label>تاريخ نهاية التصريح (Permit End Date)
          <input type="date" name="permitEndDate" required />
        </label>
      </fieldset>

      <button type="submit" id="submitBtn">
        <span id="btnText">إنشاء وتنزيل PDF / Generate &amp; Download PDF</span>
        <span id="spinner" style="display:none"> ...</span>
      </button>
      <p id="statusMsg"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
