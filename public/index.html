<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إنشاء تصريح جديد | New Permit</title>

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="user-bar" id="userBar">
      <div class="user-info">
        <span class="user-badge">👤 <span id="userNameDisplay">admin</span></span>
      </div>
    </div>

    <h1>إصدار تصريح موارد بشرية</h1>
    <p class="sub">Fill in the details below to generate the permit PDF with QR code.</p>

    <form id="permitForm">
      <div id="personsContainer">
        <!-- Person forms will be rendered here (Person 1 is rendered by default) -->
      </div>

      <!-- + Add Another Person Button -->
      <button type="button" class="btn-add-another" id="btnAddPerson">
        + إضافة شخص آخر / Add Another Person
      </button>

      <!-- Price summary -->
      <div class="order-summary-box" id="summaryBox">
        <span>المبلغ الإجمالي / Total Amount (<span id="personCountText">1</span> شخص)</span>
        <strong id="totalPriceText">SAR 22.35</strong>
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">إنشاء وتنزيل PDF / Generate &amp; Download PDF — SAR 22.35</span>
        <span id="spinner" style="display:none"> ...</span>
      </button>
      <p id="statusMsg"></p>
    </form>
  </div>

  <!-- Template for each person form -->
  <template id="personTemplate">
    <div class="person-block" data-person-index="0">
      <div class="person-header" style="display:none;">
        <span class="person-header-title">شخص 1 / Person 1</span>
        <button type="button" class="btn-remove-person">حذف / Remove</button>
      </div>

      <fieldset>
        <legend>بيانات العامل / Laborer Information</legend>

        <label>اسم العامل — English (مطلوب)
          <input type="text" name="laborerNameEn" required placeholder="" style="text-transform:uppercase;" />
        </label>
        <label>اسم العامل — Arabic (optional)
          <input type="text" name="laborerNameAr" placeholder="" dir="rtl" />
        </label>
        <label>المهنة — Occupation English (مطلوب)
          <input type="text" name="occupationEn" required placeholder="" />
        </label>
        <label>المهنة — Arabic (optional)
          <input type="text" name="occupationAr" placeholder="" dir="rtl" />
        </label>
        <label>الجنسية — Nationality English (مطلوب)
          <input type="text" name="nationalityEn" required placeholder="" />
        </label>
        <label>الجنسية — Arabic (optional)
          <input type="text" name="nationalityAr" placeholder="" dir="rtl" />
        </label>
        <label>رقم الهوية / الإقامة (ID / Iqama Number)
          <input type="text" name="idNumber" required placeholder="" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات مقدم الخدمة / Provider Establishment</legend>
        <label>المنشأة المقدمة للخدمة — Arabic (مطلوب)
          <input type="text" name="providerNameAr" required placeholder="" dir="rtl" />
        </label>
        <label>اسم المنشأة — English (optional)
          <input type="text" name="providerNameEn" placeholder="" />
        </label>
        <label>رقم المنشأة في وزارة الموارد البشرية (Establishment Number)
          <input type="text" name="providerEstablishmentNumber" required placeholder="" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات المستفيد من الخدمة / Beneficiary Establishment</legend>
        <label>المنشأة المستفيدة من الخدمة — Arabic (مطلوب)
          <input type="text" name="beneficiaryNameAr" required placeholder="" dir="rtl" />
        </label>
        <label>اسم المنشأة — English (optional)
          <input type="text" name="beneficiaryNameEn" placeholder="" />
        </label>
        <label>رقم المنشأة في وزارة الموارد البشرية (Establishment Number)
          <input type="text" name="beneficiaryEstablishmentNumber" required placeholder="" />
        </label>
      </fieldset>

      <fieldset>
        <legend>بيانات التصريح / Permit Information</legend>
        <label>رقم التصريح (Permit Code)
          <input type="text" name="permitCode" placeholder="" />
        </label>
        <label>تاريخ بداية التصريح (Permit Start Date)
          <input type="date" name="permitStartDate" required />
        </label>
        <label>تاريخ نهاية التصريح (Permit End Date)
          <input type="date" name="permitEndDate" required />
        </label>
      </fieldset>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
