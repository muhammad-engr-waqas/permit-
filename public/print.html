<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      color: #1a1a1a;
      font-size: 11px;
    }

    .no-print {
      text-align: center;
      margin-bottom: 16px;
    }
    .btn-print {
      background: #1a5276;
      color: #fff;
      border: none;
      padding: 10px 32px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-print:hover { background: #154360; }

    /* A4 page */
    .page {
      background: #fff;
      width: 794px;
      min-height: 1123px;
      margin: 0 auto;
      padding: 32px 36px 28px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    }

    /* ── HEADER BOX ── */
    .header-box {
      border: 1px solid #999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .qr-wrap img {
      width: 115px;
      height: 115px;
      display: block;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      text-align: right;
      line-height: 1.5;
    }
    .header-logos {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-ajeer-img {
      height: 56px;
      width: auto;
    }
    .logo-ministry-img {
      height: 56px;
      width: auto;
    }

    /* ── INTRO TEXT ── */
    .intro {
      font-size: 11px;
      line-height: 2;
      text-align: justify;
      margin-bottom: 14px;
      color: #1a1a1a;
      direction: rtl;
    }

    /* ── TABLES ── */
    table.permit-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 10.5px;
      direction: rtl;
    }
    table.permit-table .table-header td {
      background: #fff;
      border: 1px solid #888;
      text-align: center;
      font-weight: 700;
      font-size: 11.5px;
      padding: 5px 8px;
      color: #1a1a1a;
    }
    table.permit-table td {
      border: 1px solid #aaa;
      padding: 6px 10px;
      vertical-align: top;
    }
    .cell-label {
      font-size: 9px;
      color: #666;
      margin-bottom: 3px;
      line-height: 1.4;
    }
    .cell-value {
      font-weight: 700;
      font-size: 11px;
      color: #111;
    }

    /* ── DECLARATIONS ── */
    .declarations {
      margin-top: 16px;
      direction: rtl;
    }
    .decl-main-title {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      text-decoration: underline;
    }
    .decl-sub-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .decl-list {
      list-style: disc;
      padding-right: 20px;
      line-height: 2.1;
      font-size: 10.5px;
      color: #1a1a1a;
    }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #1a1a1a;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .page {
        box-shadow: none;
        width: 100%;
        padding: 18px 22px;
        min-height: unset;
      }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <button class="btn-print" onclick="window.print()">🖨️ Save as PDF / طباعة</button>
  </div>

  <div class="page" id="permit-page">
    <p style="text-align:center;color:#888;padding:60px 0;">جاري التحميل... Loading...</p>
  </div>

  <script>
    const id   = window.location.pathname.split("/").pop();
    const page = document.getElementById("permit-page");

    function fmt(d) {
      if (!d) return "";
      const dt = new Date(d);
      return dt.getFullYear() + "-" +
        String(dt.getMonth() + 1).padStart(2, "0") + "-" +
        String(dt.getDate()).padStart(2, "0");
    }

    fetch("/api/permits/" + id)
      .then(function(r) {
        if (!r.ok) throw new Error("Not found");
        return r.json();
      })
      .then(function(p) {
        const verifyUrl = window.location.origin + "/verify/" + id;
        const qrSrc = "https://api.qrserver.com/v1/create-qr-code/?size=115x115&margin=4&data=" +
                      encodeURIComponent(verifyUrl);

        page.innerHTML =
          '<div class="header-box">' +
            '<div class="qr-wrap">' +
              '<img id="qr-img" src="' + qrSrc + '" alt="QR Code" />' +
            '</div>' +
            '<div class="header-right">' +
              '<div class="header-title">إشعار أجير حلول الموارد<br/>البشرية</div>' +
              '<div class="header-logos">' +
                /* Ministry logo SVG */
                '<svg class="logo-ministry-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90">' +
                  '<text x="110" y="28" font-family="Tahoma,Arial" font-size="13" font-weight="bold" fill="#2c7a3a" text-anchor="middle">وزارة الموارد البشرية</text>' +
                  '<text x="110" y="46" font-family="Tahoma,Arial" font-size="13" font-weight="bold" fill="#2c7a3a" text-anchor="middle">والتنمية الاجتماعية</text>' +
                  '<text x="110" y="62" font-family="Tahoma,Arial" font-size="10" fill="#555" text-anchor="middle">المملكة العربية السعودية</text>' +
                  /* palm/flower icon */
                  '<g transform="translate(168,10) scale(0.45)">' +
                    '<polygon points="50,0 65,35 100,35 73,57 84,92 50,70 16,92 27,57 0,35 35,35" fill="#f0a500" opacity="0.9"/>' +
                    '<polygon points="50,10 60,38 88,38 66,54 74,82 50,66 26,82 34,54 12,38 40,38" fill="#2c7a3a" opacity="0.85"/>' +
                  '</g>' +
                '</svg>' +
                /* Ajeer logo SVG */
                '<svg class="logo-ajeer-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 90">' +
                  '<text x="55" y="48" font-family="Tahoma,Arial" font-size="36" font-weight="900" fill="#1a2e5a" text-anchor="middle">أجير</text>' +
                  '<rect x="18" y="52" width="38" height="7" rx="3" fill="#3aaa5c"/>' +
                  '<text x="55" y="76" font-family="Arial" font-size="11" font-weight="700" fill="#3aaa5c" text-anchor="middle">AJEER</text>' +
                '</svg>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="intro">' +
            'نشعركم أنه تم التعاقد من قبلنا كجهة مقدمة للخدمة مع الجهة المستفيدة من الخدمة حسب المعلومات المبينة أدناه، ' +
            'ولذلك تم تسجيل معلومات العقد لتكون بحوزة العامل لإثبات عدم مخالفته لنظام العمل ولتقديمها إلى من يهمه الأمر ' +
            'من الجهات المختصة عند طلبها للتحقق من صحة تواجده في مكان تقديم الخدمة.' +
          '</div>' +

          /* ── Laborer ── */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="3">بيانات العامل &nbsp; Laborer Information</td></tr>' +
            '<tr>' +
              '<td><div class="cell-label">اسم العامل<br/>Laborer Name</div><div class="cell-value">' + (p.laborerNameEn || '') + '</div></td>' +
              '<td><div class="cell-label">المهنة<br/>Occupation</div><div class="cell-value">' + (p.occupationEn || '') + '</div></td>' +
              '<td><div class="cell-label">سائق شاحنة ثقيلة<br/>Nationality</div><div class="cell-value">' + (p.nationalityEn || '') + '</div></td>' +
            '</tr>' +
            '<tr>' +
              '<td colspan="3"><div class="cell-label">رقم الهوية / الإقامة &nbsp; ID Number</div><div class="cell-value">' + (p.idNumber || '') + '</div></td>' +
            '</tr>' +
          '</table>' +

          /* ── Provider ── */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات مقدم الخدمة &nbsp; Provider Information</td></tr>' +
            '<tr>' +
              '<td style="width:65%"><div class="cell-label">المنشأة المقدمة للخدمة<br/>Provider Establishment</div>' +
                '<div class="cell-value">' + (p.providerNameEn || '') + (p.providerNameAr ? '<br/>' + p.providerNameAr : '') + '</div></td>' +
              '<td><div class="cell-label">رقم المنشأة في وزارة الموارد البشرية والتنمية الاجتماعية<br/>Establishment Number</div>' +
                '<div class="cell-value">' + (p.providerEstablishmentNumber || '') + '</div></td>' +
            '</tr>' +
          '</table>' +

          /* ── Beneficiary ── */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات المستفيد من الخدمة &nbsp; Beneficiary Information</td></tr>' +
            '<tr>' +
              '<td style="width:65%"><div class="cell-label">المنشأة المستفيدة من الخدمة<br/>Beneficiary Establishment</div>' +
                '<div class="cell-value">' + (p.beneficiaryNameEn || '') + (p.beneficiaryNameAr ? '<br/>' + p.beneficiaryNameAr : '') + '</div></td>' +
              '<td><div class="cell-label">رقم المنشأة في وزارة الموارد البشرية والتنمية الاجتماعية<br/>Establishment Number</div>' +
                '<div class="cell-value">' + (p.beneficiaryEstablishmentNumber || '') + '</div></td>' +
            '</tr>' +
          '</table>' +

          /* ── Permit dates ── */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات التصريح &nbsp; Permit Information</td></tr>' +
            '<tr>' +
              '<td><div class="cell-label">تاريخ بداية التصريح<br/>Permit Start Date</div><div class="cell-value">' + fmt(p.permitStartDate) + '</div></td>' +
              '<td><div class="cell-label">تاريخ نهاية التصريح<br/>Permit End Date</div><div class="cell-value">' + fmt(p.permitEndDate) + '</div></td>' +
            '</tr>' +
          '</table>' +

          /* ── Declarations ── */
          '<div class="declarations">' +
            '<div class="decl-main-title">إقرارات</div>' +
            '<div class="decl-sub-title">أقر أنا المنشأة المقدمة للخدمة والموضحة بأعلى وأتعهد بـ:</div>' +
            '<ul class="decl-list">' +
              '<li>إن العامل حامل هذا التصريح يقر ويتعهد بأن البيانات المدونة فيه صحيحة على مسؤوليته الشخصية، وأنه يعمل لدى المنشأة ولحسابها بموجب رخصة إقامة سارية المفعول.</li>' +
              '<li>الالتزام والتقيد بأنظمة العمل والعمال والأفراد والأحوال الشخصية وأي أنظمة ولوائح وقرارات أخرى ذات علاقة.</li>' +
              '<li>إن الموقع الإلكتروني الخاص بأجير حلول الموارد البشرية متاح من قِبله أو القائمين عليه للتحقق مما هو وارد بهذا التصريح.</li>' +
              '<li>إن إلزام أصحاب الأعمال أو غيرهم على التعامل مع المنشأة فقط وبدون أي إلزام قانون أو غيره على التعامل مع موقع أجير.</li>' +
              '<li>أي تعديل أو كشط في هذا التصريح يجعله لاغياً.</li>' +
            '</ul>' +
          '</div>' +

          '<div class="page-footer">"خدمة مقدمة من وزارة الموارد البشرية والتنمية الاجتماعية"</div>';

        /* Auto print after QR loads */
        var qrImg = document.getElementById("qr-img");
        qrImg.onload  = function() { setTimeout(function(){ window.print(); }, 600); };
        qrImg.onerror = function() { setTimeout(function(){ window.print(); }, 800); };
        /* Fallback */
        setTimeout(function(){ window.print(); }, 2500);
      })
      .catch(function() {
        page.innerHTML = '<p style="text-align:center;color:red;padding:60px">Permit not found</p>';
      });
  </script>
</body>
</html>
