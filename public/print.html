<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>تصريح أجير - الإعارة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #e8e8e8;
      padding: 20px;
      direction: rtl;
    }

    .no-print {
      text-align: center;
      margin-bottom: 16px;
    }
    .btn-print {
      background: #1a5276;
      color: #fff;
      border: none;
      padding: 10px 32px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ── A4 PAGE ── */
    .page {
      background: #fff;
      width: 794px;
      min-height: 1122px;
      margin: 0 auto;
      padding: 28px 32px 32px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.18);
      font-size: 11px;
      color: #1a1a1a;
    }

    /* ── TOP HEADER ── */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #bbb;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .qr-section img {
      width: 80px;
      height: 80px;
    }
    .permit-number {
      font-size: 9px;
      color: #444;
      text-align: center;
    }

    .center-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      flex: 1;
      padding: 0 20px;
    }

    .right-logos {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Ministry logo SVG */
    .ministry-svg {
      height: 54px;
      width: auto;
    }
    /* Ajeer logo */
    .ajeer-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .ajeer-svg {
      height: 54px;
      width: auto;
    }

    /* ── INTRO ── */
    .intro-text {
      font-size: 11px;
      line-height: 1.95;
      text-align: justify;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    /* ── INFO TABLES ── */
    table.info {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      font-size: 11px;
    }
    table.info .section-header td {
      background: #f5f5f5;
      border: 1px solid #aaa;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      padding: 5px 8px;
      color: #1a1a1a;
    }
    table.info td {
      border: 1px solid #bbb;
      padding: 7px 10px;
      vertical-align: middle;
    }
    .lbl {
      font-size: 10px;
      color: #555;
      margin-bottom: 2px;
    }
    .val {
      font-weight: 600;
      font-size: 11.5px;
      color: #111;
    }

    /* ── DECLARATIONS ── */
    .decl-section {
      margin-top: 14px;
      direction: rtl;
    }
    .decl-main-title {
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .decl-sub {
      font-weight: 700;
      font-size: 11.5px;
      margin-bottom: 8px;
    }
    .decl-list {
      list-style: disc;
      padding-right: 22px;
      font-size: 11px;
      line-height: 2;
      color: #1a1a1a;
    }
    .decl-list li {
      margin-bottom: 2px;
    }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 10.5px;
      color: #333;
      border-top: 1px solid #ddd;
      padding-top: 10px;
      line-height: 1.8;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .page {
        box-shadow: none;
        width: 100%;
        margin: 0;
        padding: 14px 18px;
        min-height: unset;
      }
      @page { size: A4 portrait; margin: 8mm 8mm; }
    }
  </style>
</head>
<body>

<div class="no-print">
  <button class="btn-print" onclick="window.print()">🖨️ Save as PDF / طباعة</button>
</div>

<div class="page" id="permit-page">
  <p style="text-align:center;color:#888;padding:80px 0;font-size:14px;">جاري التحميل... Loading...</p>
</div>

<script>
  var id   = window.location.pathname.split("/").pop();
  var page = document.getElementById("permit-page");

  function fmt(d) {
    if (!d) return "";
    var dt = new Date(d);
    return dt.getFullYear() + "-" +
      String(dt.getMonth()+1).padStart(2,"0") + "-" +
      String(dt.getDate()).padStart(2,"0");
  }

  /* ── Ministry logo SVG (palm/flower + Arabic text) ── */
  var ministrySVG =
    '<svg class="ministry-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60">' +
      /* flower icon */
      '<g transform="translate(138,4) scale(0.52)">' +
        '<path d="M26,0 Q30,14 20,18 Q14,8 0,8 Q10,20 6,28 Q18,24 26,32 Q26,18 38,16 Q36,28 46,28 Q40,20 52,18 Q38,8 42,0 Q34,12 26,0Z" fill="#f0a500"/>' +
        '<path d="M26,6 Q29,16 22,20 Q16,12 4,12 Q14,22 10,28 Q20,25 26,32 Q26,20 36,18 Q35,26 44,26 Q38,18 48,16 Q36,10 40,4 Q33,14 26,6Z" fill="#2e8b4a" opacity="0.85"/>' +
      '</g>' +
      /* text */
      '<text x="62" y="20" font-family="Tahoma,Arial" font-size="11" font-weight="bold" fill="#2e8b4a" text-anchor="middle" direction="rtl">وزارة الموارد البشرية</text>' +
      '<text x="62" y="36" font-family="Tahoma,Arial" font-size="11" font-weight="bold" fill="#2e8b4a" text-anchor="middle" direction="rtl">والتنمية الاجتماعية</text>' +
      '<text x="62" y="50" font-family="Tahoma,Arial" font-size="9" fill="#666" text-anchor="middle" direction="rtl">المملكة العربية السعودية</text>' +
    '</svg>';

  /* ── Ajeer logo SVG ── */
  var ajeerSVG =
    '<svg class="ajeer-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 60">' +
      /* أجير text */
      '<text x="45" y="34" font-family="Tahoma,Arial" font-size="28" font-weight="900" fill="#1b2a4a" text-anchor="middle" direction="rtl">أجير</text>' +
      /* green underline bar */
      '<rect x="10" y="38" width="42" height="6" rx="3" fill="#3aaa5c"/>' +
      /* AJEER text */
      '<text x="45" y="54" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#3aaa5c" text-anchor="middle">AJEER</text>' +
    '</svg>';

  fetch("/api/permits/" + id)
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(p){

      var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=80x80&margin=2&data=" +
                  encodeURIComponent(window.location.origin + "/verify/" + id);

      page.innerHTML =

        /* ── TOP HEADER ── */
        '<div class="top-header">' +
          '<div class="qr-section">' +
            '<img id="qr-img" src="' + qrUrl + '" alt="QR"/>' +
            '<div class="permit-number">' + (p._id ? p._id.toString().slice(-8).toUpperCase() : '') + '</div>' +
          '</div>' +
          '<div class="center-title">تصريح أجير - الإعارة</div>' +
          '<div class="right-logos">' +
            ajeerSVG +
            ministrySVG +
          '</div>' +
        '</div>' +

        /* ── INTRO ── */
        '<div class="intro-text">' +
          'نشعركم أنه تم التعاقد من قبلنا كجهة مقدمة للخدمة مع الجهة المستفيدة من الخدمة حسب المعلومات المبينة أدناه، ولذلك تم تسجيل ' +
          'معلومات العقد لتكون بحوزة العامل لإثبات عدم مخالفته لنظام العمل ولتقديمها إلى من يهمه الأمر من الجهات المختصة عند طلبها ' +
          'للتحقق من صحة تواجده في مكان تقديم الخدمة' +
        '</div>' +

        /* ── LABORER TABLE ── */
        '<table class="info">' +
          '<tr class="section-header"><td colspan="4">بيانات العامل</td></tr>' +
          '<tr>' +
            '<td><div class="lbl">اسم العامل</div><div class="val">' + (p.laborerNameEn||'') + '</div></td>' +
            '<td><div class="lbl">المهنة</div><div class="val">' + (p.occupationEn||'') + '</div></td>' +
            '<td colspan="2"></td>' +
          '</tr>' +
          '<tr>' +
            '<td><div class="lbl">رقم الهوية / الإقامة</div><div class="val">' + (p.idNumber||'') + '</div></td>' +
            '<td><div class="lbl">الجنسية</div><div class="val">' + (p.nationalityEn||'') + '</div></td>' +
            '<td colspan="2"></td>' +
          '</tr>' +
        '</table>' +

        /* ── PROVIDER TABLE ── */
        '<table class="info">' +
          '<tr class="section-header"><td colspan="3">بيانات مقدم الخدمة</td></tr>' +
          '<tr>' +
            '<td style="width:30%"><div class="lbl">المنشأة المقدمة للخدمة</div><div class="val">' + (p.providerNameEn||'') + (p.providerNameAr ? '<br/>'+p.providerNameAr : '') + '</div></td>' +
            '<td style="width:40%"><div class="lbl">رقم المنشأة في وزارة الموارد البشرية و التنمية الإجتماعية</div></td>' +
            '<td style="width:30%"><div class="val">' + (p.providerEstablishmentNumber||'') + '</div></td>' +
          '</tr>' +
        '</table>' +

        /* ── BENEFICIARY TABLE ── */
        '<table class="info">' +
          '<tr class="section-header"><td colspan="3">بيانات المستفيد من الخدمة</td></tr>' +
          '<tr>' +
            '<td style="width:30%"><div class="lbl">المنشأة المستفيدة من الخدمة</div><div class="val">' + (p.beneficiaryNameEn||'') + (p.beneficiaryNameAr ? '<br/>'+p.beneficiaryNameAr : '') + '</div></td>' +
            '<td style="width:40%"><div class="lbl">رقم المنشأة في وزارة الموارد البشرية و التنمية الإجتماعية</div></td>' +
            '<td style="width:30%"><div class="val">' + (p.beneficiaryEstablishmentNumber||'') + '</div></td>' +
          '</tr>' +
        '</table>' +

        /* ── PERMIT DATES TABLE ── */
        '<table class="info">' +
          '<tr class="section-header"><td colspan="4">بيانات التصريح</td></tr>' +
          '<tr>' +
            '<td><div class="lbl">تاريخ بداية التصريح</div><div class="val">' + fmt(p.permitStartDate) + '</div></td>' +
            '<td><div class="lbl">تاريخ نهاية التصريح</div><div class="val">' + fmt(p.permitEndDate) + '</div></td>' +
            '<td colspan="2"></td>' +
          '</tr>' +
        '</table>' +

        /* ── DECLARATIONS ── */
        '<div class="decl-section">' +
          '<div class="decl-main-title">إقرارات</div>' +
          '<div class="decl-sub">أقر أنا المنشأة المقدمة للخدمة والموضحة بياناتي أعلاه وأتعهد بـ:</div>' +
          '<ul class="decl-list">' +
            '<li>إن العامل حامل هذا التصريح بحمله له يقر ويتعهد بأن البيانات المدونة فيه صحيحة على مسؤوليته الشخصية، وأنه يعمل لدى المنشأة ولحسابها، بموجب رخصة إقامة سارية المفعول. وأتحمل أي تبعات قانونية أو غرامات تترتب على خلاف المذكور أعلاه.</li>' +
            '<li>أنه تم الحصول على موافقة الموظف لإعارة خدماته للمنشأة المستفيدة قبل إصدار التصريح.</li>' +
            '<li>الالتزام والتقيد بأنظمة العمل والعمال وأي أنظمة و لوائح وقرارات أخرى ذات علاقة.</li>' +
            '<li>أن الموقع الإلكتروني الخاص بأجير أو القائمين عليه عبارة عن وسيط إلكتروني ما بين الباحثين عن العمل وأصحاب الأعمال فقط وبدون أي التزام قانوني أو غيره على القائمين على موقع أجير.</li>' +
            '<li>أي تعديل أو كشط في هذا التصريح يجعله لاغياً.</li>' +
          '</ul>' +
        '</div>' +

        /* ── FOOTER ── */
        '<div class="page-footer">' +
          'للتحقق من صحة هذا التصريح وسريان مفعوله بإمكانك زيارة موقع أجير (https://ajeer.com.sa)<br/>' +
          '* خدمة معتمدة من وزارة الموارد البشرية والتنمية الإجتماعية *' +
        '</div>';

      /* Auto print after QR loads */
      var qImg = document.getElementById("qr-img");
      qImg.onload  = function(){ setTimeout(function(){ window.print(); }, 700); };
      qImg.onerror = function(){ setTimeout(function(){ window.print(); }, 900); };
      setTimeout(function(){ window.print(); }, 2800);
    })
    .catch(function(){
      page.innerHTML = '<p style="text-align:center;color:red;padding:80px;font-size:14px">Permit not found</p>';
    });
</script>
</body>
</html>
