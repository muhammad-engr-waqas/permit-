<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permit - إشعار أجير</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #e8e8e8;
      padding: 20px;
      color: #1a1a1a;
      font-size: 11px;
    }

    .no-print {
      text-align: center;
      margin-bottom: 16px;
    }
    .btn-print {
      background: #1a2e5a;
      color: #fff;
      border: none;
      padding: 10px 36px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-print:hover { background: #0f1e3d; }

    /* ── A4 PAGE ── */
    .page {
      background: #fff;
      width: 794px;
      min-height: 1123px;
      margin: 0 auto;
      padding: 28px 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }

    /* ── HEADER BOX ── */
    .header-box {
      border: 1px solid #999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      margin-bottom: 16px;
      height: 235px;
      direction: ltr; /* Force left-to-right container flow */
    }

    /* QR on the LEFT */
    .qr-wrap-left {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 215px;
      height: 215px;
    }
    .qr-wrap-left img {
      width: 215px;
      height: 215px;
      display: block;
      border: 1px solid #000; /* Distinct black border around QR code */
    }

    /* Title in CENTER */
    .header-title-center {
      font-size: 19px;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      line-height: 1.6;
      flex-grow: 1;
      direction: rtl;
    }

    /* Logos on the RIGHT */
    .header-logos-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-shrink: 0;
      direction: ltr;
    }

    /* Real Ajeer logo image */
    .logo-ajeer-img {
      height: 52px;
      width: auto;
    }

    /* Ministry logo image */
    .logo-ministry-img {
      height: 60px;
      width: auto;
      flex-shrink: 0;
    }

    /* ── INTRO TEXT ── */
    .intro {
      font-size: 11px;
      line-height: 2.1;
      text-align: justify;
      margin-bottom: 12px;
      color: #1a1a1a;
      direction: rtl;
      border: 1px solid #ddd;
      padding: 8px 12px;
      background: #fafafa;
    }

    /* ── TABLES ── */
    table.permit-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 7px;
      font-size: 10.5px;
      direction: rtl;
    }
    table.permit-table .table-header td {
      background: #fff;
      border: 1px solid #777;
      text-align: center;
      font-weight: 700;
      font-size: 11.5px;
      padding: 5px 8px;
      color: #1a1a1a;
    }
    table.permit-table td {
      border: 1px solid #aaa;
      padding: 7px 10px;
      vertical-align: top;
    }
    .cell-label {
      font-size: 9px;
      color: #555;
      margin-bottom: 3px;
      line-height: 1.5;
      direction: rtl;
    }
    .cell-label .ar { display: block; font-weight: 600; }
    .cell-label .en { display: block; color: #777; }
    .cell-value {
      font-weight: 700;
      font-size: 11.5px;
      color: #111;
    }

    /* ── DECLARATIONS ── */
    .declarations {
      margin-top: 14px;
      direction: rtl;
    }
    .decl-main-title {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      text-decoration: underline;
      color: #1a1a1a;
    }
    .decl-sub-title {
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #1a1a1a;
    }
    .decl-list {
      list-style: disc;
      padding-right: 20px;
      line-height: 2.1;
      font-size: 10.5px;
      color: #1a1a1a;
    }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #1a1a1a;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    /* ── PRINT MEDIA ── */
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .page {
        box-shadow: none;
        width: 100%;
        padding: 14px 18px;
        min-height: unset;
      }
      @page { size: A4 portrait; margin: 8mm 10mm; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <button class="btn-print" onclick="window.print()">🖨️ Save as PDF / طباعة</button>
  </div>

  <div class="page" id="permit-page">
    <p style="text-align:center;color:#888;padding:60px 0;">جاري التحميل... Loading...</p>
  </div>

  <script>
    var id   = window.location.pathname.split("/").pop();
    var page = document.getElementById("permit-page");

    function fmt(d) {
      if (!d) return "";
      var dt = new Date(d);
      return dt.getFullYear() + "-" +
        String(dt.getMonth() + 1).padStart(2, "0") + "-" +
        String(dt.getDate()).padStart(2, "0");
    }

    fetch("/api/permits/" + id)
      .then(function(r) {
        if (!r.ok) throw new Error("Not found");
        return r.json();
      })
      .then(function(p) {

        var verifyUrl = window.location.origin + "/verify/" + id;
        var qrSrc = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=4&data=" +
                    encodeURIComponent(verifyUrl);

        page.innerHTML =
          /* ════════════ HEADER BOX ════════════ */
          '<div class="header-box">' +
            /* QR — left side */
            '<div class="qr-wrap-left">' +
              '<img id="qr-img" src="' + qrSrc + '" alt="QR Code" />' +
            '</div>' +

            /* Title — CENTER */
            '<div class="header-title-center">إشعار أجير حلول الموارد<br/>البشرية</div>' +

            /* Logos — RIGHT side */
            '<div class="header-logos-right">' +
              /* Ajeer Logo */
              '<img class="logo-ajeer-img" src="/ajeer-new-logo-copy.png" alt="Ajeer Logo" />' +

              /* Ministry Logo Image */
              '<img class="logo-ministry-img" src="/Saudi Arabia launches Hajj Ajeer service for Seasonal employment of Hajj - Saudi-Expatriates.com.jpg" alt="Ministry Logo" />' +
            '</div>' +
          '</div>' +

          /* ════════════ INTRO ════════════ */
          '<div class="intro">' +
            'نشعركم أنه تم التعاقد من قبلنا كجهة مقدمة للخدمة مع الجهة المستفيدة من الخدمة حسب المعلومات المبينة أدناه، ' +
            'ولذلك تم تسجيل معلومات العقد لتكون بحوزة العامل لإثبات عدم مخالفته لنظام العمل ولتقديمها إلى من يهمه الأمر ' +
            'من الجهات المختصة عند طلبها للتحقق من صحة تواجده في مكان تقديم الخدمة.' +
          '</div>' +

          /* ════════════ LABORER TABLE ════════════ */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="3">بيانات العامل &nbsp; Laborer Information</td></tr>' +
            '<tr>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">اسم العامل</span><span class="en">Laborer Name</span></div>' +
                '<div class="cell-value">' + (p.laborerNameEn || '') + '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">المهنة</span><span class="en">Occupation</span></div>' +
                '<div class="cell-value">' + (p.occupationEn || '') + '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">سائق شاحنة ثقيلة</span><span class="en">Nationality</span></div>' +
                '<div class="cell-value">' + (p.nationalityEn || '') + '</div>' +
              '</td>' +
            '</tr>' +
            '<tr>' +
              '<td colspan="3">' +
                '<div class="cell-label"><span class="ar">رقم الهوية / الإقامة</span><span class="en">ID Number</span></div>' +
                '<div class="cell-value">' + (p.idNumber || '') + '</div>' +
              '</td>' +
            '</tr>' +
          '</table>' +

          /* ════════════ PROVIDER TABLE ════════════ */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات مقدم الخدمة &nbsp; Provider Information</td></tr>' +
            '<tr>' +
              '<td style="width:65%">' +
                '<div class="cell-label"><span class="ar">المنشأة المقدمة للخدمة</span><span class="en">Provider Establishment</span></div>' +
                '<div class="cell-value">' + (p.providerNameEn || '') + (p.providerNameAr ? '<br/>' + p.providerNameAr : '') + '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">رقم المنشأة في وزارة الموارد البشرية والتنمية الاجتماعية</span><span class="en">Establishment Number</span></div>' +
                '<div class="cell-value">' + (p.providerEstablishmentNumber || '') + '</div>' +
              '</td>' +
            '</tr>' +
          '</table>' +

          /* ════════════ BENEFICIARY TABLE ════════════ */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات المستفيد من الخدمة &nbsp; Beneficiary Information</td></tr>' +
            '<tr>' +
              '<td style="width:65%">' +
                '<div class="cell-label"><span class="ar">المنشأة المستفيدة من الخدمة</span><span class="en">Beneficiary Establishment</span></div>' +
                '<div class="cell-value">' + (p.beneficiaryNameEn || '') + (p.beneficiaryNameAr ? '<br/>' + p.beneficiaryNameAr : '') + '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">رقم المنشأة في وزارة الموارد البشرية والتنمية الاجتماعية</span><span class="en">Establishment Number</span></div>' +
                '<div class="cell-value">' + (p.beneficiaryEstablishmentNumber || '') + '</div>' +
              '</td>' +
            '</tr>' +
          '</table>' +

          /* ════════════ PERMIT DATES TABLE ════════════ */
          '<table class="permit-table">' +
            '<tr class="table-header"><td colspan="2">بيانات التصريح &nbsp; Permit Information</td></tr>' +
            '<tr>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">تاريخ بداية التصريح</span><span class="en">Permit Start Date</span></div>' +
                '<div class="cell-value">' + fmt(p.permitStartDate) + '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-label"><span class="ar">تاريخ نهاية التصريح</span><span class="en">Permit End Date</span></div>' +
                '<div class="cell-value">' + fmt(p.permitEndDate) + '</div>' +
              '</td>' +
            '</tr>' +
          '</table>' +

          /* ════════════ DECLARATIONS ════════════ */
          '<div class="declarations">' +
            '<div class="decl-main-title">إقرارات</div>' +
            '<div class="decl-sub-title">أقر أنا المنشأة المقدمة للخدمة والموضحة بأعلى وأتعهد بـ:</div>' +
            '<ul class="decl-list">' +
              '<li>إن العامل حامل هذا التصريح يقر ويتعهد بأن البيانات المدونة فيه صحيحة على مسؤوليته الشخصية، وأنه يعمل لدى المنشأة ولحسابها بموجب رخصة إقامة سارية المفعول.</li>' +
              '<li>الالتزام والتقيد بأنظمة العمل والعمال والأفراد والأحوال الشخصية وأي أنظمة ولوائح وقرارات أخرى ذات علاقة.</li>' +
              '<li>إن الموقع الإلكتروني الخاص بأجير حلول الموارد البشرية متاح من قِبله أو القائمين عليه للتحقق مما هو وارد بهذا التصريح.</li>' +
              '<li>إن إلزام أصحاب الأعمال أو غيرهم على التعامل مع المنشأة فقط وبدون أي إلزام قانون أو غيره على التعامل مع موقع أجير.</li>' +
              '<li>أي تعديل أو كشط في هذا التصريح يجعله لاغياً.</li>' +
            '</ul>' +
          '</div>' +

          /* ════════════ FOOTER ════════════ */
          '<div class="page-footer">"خدمة مقدمة من وزارة الموارد البشرية والتنمية الاجتماعية"</div>';

        /* ── Wait for QR, then auto-print ── */
        var qrImg = document.getElementById("qr-img");
        if (qrImg) {
          qrImg.onload  = function() { setTimeout(function(){ window.print(); }, 700); };
          qrImg.onerror = function() { setTimeout(function(){ window.print(); }, 900); };
        }
        /* Fallback trigger */
        setTimeout(function(){ window.print(); }, 3000);
      })
      .catch(function() {
        page.innerHTML = '<p style="text-align:center;color:red;padding:60px">Permit not found / التصريح غير موجود</p>';
      });
  </script>
</body>
</html>
