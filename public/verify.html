<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajeer HRS Permit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef2f7;
      min-height: 100vh;
    }

    /* ── Top navbar ── */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .navbar-logo .logo-box {
      background: #1a5276;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .navbar-logo .logo-text {
      font-size: 13px;
      color: #555;
      font-weight: 500;
    }
    .navbar-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .navbar-links a {
      text-decoration: none;
      color: #333;
      font-size: 13px;
    }
    .navbar-links .lang {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #555;
    }
    .navbar-links .btn-register {
      background: #1a5276;
      color: #fff;
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    /* ── Main content ── */
    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1.page-title {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 28px;
    }

    /* ── Loading / Error ── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 16px;
    }
    .state-msg.error { color: #dc2626; }

    /* ── 3-column card grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }
    @media (max-width: 700px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border: 1px solid #e0e6ef;
      border-radius: 8px;
      padding: 22px 20px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #444;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-bottom: 1px solid #e8ecf2;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }
    .field-value {
      font-size: 14px;
      color: #111;
      font-weight: 500;
    }

    /* ── Status badge ── */
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-active  { background: #16a34a; color: #fff; }
    .badge-expired { background: #dc2626; color: #fff; }

    /* ── Bottom action bar ── */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .btn-copy {
      background: #1a3a5c;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }
    .btn-copy:hover { background: #154060; }
    .btn-copy svg { width: 16px; height: 16px; fill: #fff; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-logo">
      <span class="logo-box">أجير</span>
      <span class="logo-text">Ajeer HRS</span>
    </div>
    <div class="navbar-links">
      <span class="lang">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        العربية
      </span>
      <a href="#">Knowledge Center</a>
      <a href="#">Sign in</a>
      <a href="#" class="btn-register">Register now</a>
    </div>
  </nav>

  <!-- Page content -->
  <div class="container">
    <h1 class="page-title">Ajeer HRS permit</h1>

    <div id="content">
      <p class="state-msg">Loading… جاري التحميل</p>
    </div>
  </div>

  <script>
    const id      = window.location.pathname.split("/").pop();
    const content = document.getElementById("content");

    fetch(`/api/permits/${id}`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(p => {
        const start   = new Date(p.permitStartDate);
        const end     = new Date(p.permitEndDate);
        const today   = new Date();
        const active  = today >= start && today <= end;

        const fmt = d =>
          d.getFullYear() + '-' +
          String(d.getMonth()+1).padStart(2,'0') + '-' +
          String(d.getDate()).padStart(2,'0');

        content.innerHTML = `
          <div class="cards-grid">

            <!-- Card 1: Permit Information -->
            <div class="card">
              <div class="card-title">Permit Information</div>

              <div class="field">
                <div class="field-label">Laborer's name:</div>
                <div class="field-value">${p.laborerNameEn}</div>
              </div>

              <div class="field">
                <div class="field-label">Permit status:</div>
                <div class="field-value">
                  <span class="badge ${active ? 'badge-active' : 'badge-expired'}">
                    ${active ? 'ACTIVE' : 'EXPIRED'}
                  </span>
                </div>
              </div>

              <div class="field">
                <div class="field-label">Permit start date:</div>
                <div class="field-value">${fmt(start)}</div>
              </div>

              <div class="field">
                <div class="field-label">Permit expiration date:</div>
                <div class="field-value">${fmt(end)}</div>
              </div>
            </div>

            <!-- Card 2: Beneficiary Company -->
            <div class="card">
              <div class="card-title">Beneficiary Company</div>

              <div class="field">
                <div class="field-label">Establishment name:</div>
                <div class="field-value">${p.beneficiaryNameEn || ''} ${p.beneficiaryNameAr ? '<br><span style="direction:rtl;unicode-bidi:embed;">'+p.beneficiaryNameAr+'</span>' : ''}</div>
              </div>

              <div class="field">
                <div class="field-label">Establishment number:</div>
                <div class="field-value">${p.beneficiaryEstablishmentNumber}</div>
              </div>
            </div>

            <!-- Card 3: Istiqdam Company -->
            <div class="card">
              <div class="card-title">Istiqdam Company</div>

              <div class="field">
                <div class="field-label">Establishment name:</div>
                <div class="field-value">${p.providerNameEn || ''} ${p.providerNameAr ? '<br><span style="direction:rtl;unicode-bidi:embed;">'+p.providerNameAr+'</span>' : ''}</div>
              </div>

              <div class="field">
                <div class="field-label">Establishment number:</div>
                <div class="field-value">${p.providerEstablishmentNumber}</div>
              </div>
            </div>

          </div>

          <div class="action-bar">
            <button class="btn-copy" onclick="copyLink()">
              Copy link to this page
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            </button>
          </div>
        `;
      })
      .catch(() => {
        content.innerHTML = `<p class="state-msg error">Permit not found / التصريح غير موجود</p>`;
      });

    function copyLink() {
      navigator.clipboard.writeText(window.location.href)
        .then(() => alert('Link copied!'))
        .catch(() => alert(window.location.href));
    }
  </script>
</body>
</html>
